name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_TOOLCHAIN_DIR: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test suite
        run: make -j"$(nproc)" test
      - name: Compile the examples
        run: make -j"$(nproc)" examples
      - name: Tuning script tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest -v tools/test_tune_drive.py

  sanitizers:
    name: Host tests under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -fno-sanitize=vptr: UBSan's vptr check needs typeinfo that the
      # header-only command classes have no key function to emit.
      - name: Build and run with sanitizers
        run: |
          make -j"$(nproc)" test \
            TESTBINDIR=bin/tests-asan \
            HOST_CXXFLAGS="-std=gnu++20 -Iinclude -Itests -DMCLIB_HOST_BUILD -Wall -Wextra -g -O1 -fsanitize=address,undefined -fno-sanitize=vptr" \
            HOST_LDFLAGS="-pthread -fsanitize=address,undefined -fno-sanitize=vptr"
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  simulator:
    name: Physics simulator
    runs-on: ubuntu-latest
    # The Override field shapes are made from VEX's CAD, so they sit in a
    # private repo, kevinyhe/vexsim-cad, read with VEXSIM_CAD_DEPLOY_KEY.
    # Pull requests from forks get no secrets, so their planner steps skip.
    env:
      HAS_VEXSIM_CAD_KEY: ${{ secrets.VEXSIM_CAD_DEPLOY_KEY != '' }}
      FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        tracking: [drive, two, vertical, horizontal]
    steps:
      - uses: actions/checkout@v4

      - name: Check out vexsim
        uses: actions/checkout@v4
        with:
          repository: kevinyhe/vexsim
          path: vexsim

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # run.py exits nonzero on any failure, and some scenarios fail on main.
      # check_baseline.py fails only when a scenario in ci_baseline.json does.
      - name: Run the scenarios
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/vexsim/run.py --vexsim vexsim \
            --tracking-mode ${{ matrix.tracking }} --output sim-results || true
          python3 tests/vexsim/check_baseline.py ${{ matrix.tracking }} sim-results/results.json

      # The path planner's own tests: routine checks, the server, the 3D
      # replay adapter, the page's geometry against the engine's, the C++
      # export (compiled) and whole runs in vexsim. Once, on the drive leg.
      # Three.js comes from vexsim's package, pinned to the version the 3D
      # view expects. The tests and the server share one compiled library.
      - name: Install the Override world's packages
        if: env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        run: python3 -m pip install -r tests/vexsim/requirements.txt

      - name: Require the key to the Override field shapes
        if: env.HAS_VEXSIM_CAD_KEY != 'true' && env.FROM_FORK != 'true' && matrix.tracking == 'drive'
        run: |
          echo "VEXSIM_CAD_DEPLOY_KEY is not set. The planner tests need the Override field shapes from kevinyhe/vexsim-cad; tests/vexsim/README.md says how to add the key." >&2
          exit 1

      - name: Skip the planner tests on a fork
        if: env.HAS_VEXSIM_CAD_KEY != 'true' && env.FROM_FORK == 'true' && matrix.tracking == 'drive'
        run: echo "A pull request from a fork cannot read the Override field shapes. The planner tests run once it is merged."

      - name: Check out the Override field shapes
        if: env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        uses: actions/checkout@v4
        with:
          repository: kevinyhe/vexsim-cad
          ssh-key: ${{ secrets.VEXSIM_CAD_DEPLOY_KEY }}
          path: vexsim-cad

      - name: Put the shapes where vexsim reads them
        if: env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        run: |
          mkdir -p vexsim/cad/override
          cp vexsim-cad/shapes.json vexsim-cad/field.json vexsim-cad/view.json vexsim-cad/view.bin vexsim/cad/override/

      - uses: actions/setup-node@v4
        if: env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        with:
          node-version: '20'
      - name: Path planner tests
        if: env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          VEXSIM_PATH: ${{ github.workspace }}/vexsim
          MCLIB_PLANNER_CACHE: ${{ runner.temp }}/planner/cache
        run: |
          npm install --prefix vexsim --no-save --no-audit --no-fund three@0.160.0
          cd tests/vexsim/planner
          python3 -m unittest -v test_planner test_geometry test_server test_three_files
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest -v tools.test_tune_drive.SimulatorTests

      # The real page in headless Chrome against a running planner server:
      # place points, plan, run, play back, compare, export, mirror, 3D view.
      - name: Path planner browser smoke test
        if: env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          browser="$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")"
          cd "$GITHUB_WORKSPACE"
          python3 tests/vexsim/planner/server.py --vexsim vexsim --output "$RUNNER_TEMP/planner" > "$RUNNER_TEMP/planner-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/config >/dev/null && break; sleep 1; done
          node tests/vexsim/planner/browser_smoke.mjs \
            --playwright "$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            --browser "$browser" --output "$RUNNER_TEMP/planner-browser"

      - name: Keep the browser screenshots and the server log
        if: failure() && env.HAS_VEXSIM_CAD_KEY == 'true' && matrix.tracking == 'drive'
        uses: actions/upload-artifact@v4
        with:
          name: planner-browser
          path: |
            ${{ runner.temp }}/planner-browser
            ${{ runner.temp }}/planner-server.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-${{ matrix.tracking }}
          path: sim-results/results.json

  firmware:
    name: ARM firmware build and template package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Arm GNU toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain
          key: arm-gnu-14.2.rel1

      - name: Download the Arm GNU toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          curl -sL "$ARM_TOOLCHAIN_URL" | tar xJ -C toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the PROS CLI
        run: |
          pip install pros-cli
          # pros-cli 3.5.6 cannot find its own version on modern Pythons
          # because pkg_resources is gone. Its first lookup is a `version`
          # file next to the package, so write one.
          python -c "import pros, os, importlib.metadata as m; open(os.path.join(os.path.dirname(pros.__file__), '..', 'version'), 'w').write(m.version('pros-cli'))"

      - name: Build the firmware
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/$ARM_TOOLCHAIN_DIR/bin:$PATH"
          arm-none-eabi-g++ --version | head -1
          make -j"$(nproc)"

      - name: Package the PROS template
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/$ARM_TOOLCHAIN_DIR/bin:$PATH"
          make template
          ls -la mclib@*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mclib-template
          path: mclib@*.zip

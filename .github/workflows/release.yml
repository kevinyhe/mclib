name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_TOOLCHAIN_DIR: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi

jobs:
  release:
    name: Build and publish the PROS template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the Makefile version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^VERSION:=//p' Makefile)"
          echo "tag=$tag makefile=$version"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION=$version in the Makefile." >&2
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading {inside=1; next} inside && /^## / {exit} inside' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/changelog-section.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changelog-section.md"; then
            echo "CHANGELOG.md has no \"## $version\" section." >&2
            exit 1
          fi
          {
            echo "Install with \`pros c fetch mclib@$version.zip\` then \`pros c apply mclib\`."
            echo
            cat "$RUNNER_TEMP/changelog-section.md"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Run the test suite
        run: make -j"$(nproc)" test

      - name: Download the Arm GNU toolchain
        run: |
          mkdir -p toolchain
          curl -sL "$ARM_TOOLCHAIN_URL" | tar xJ -C toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the PROS CLI
        run: |
          pip install pros-cli
          python -c "import pros, os, importlib.metadata as m; open(os.path.join(os.path.dirname(pros.__file__), '..', 'version'), 'w').write(m.version('pros-cli'))"

      - name: Build the template
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/$ARM_TOOLCHAIN_DIR/bin:$PATH"
          make -j"$(nproc)"
          make template

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mclib@*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
